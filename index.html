<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
      background: #fff;
    }

    .input-row input:focus { border-color: #6366f1; }

    .input-row button {
      padding: 12px 20px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.4rem;
      cursor: pointer;
      transition: background .2s;
    }

    .input-row button:hover { background: #4f46e5; }
    .input-row button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filters button {
      padding: 6px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      background: #fff;
      font-size: .85rem;
      cursor: pointer;
      color: #64748b;
      transition: all .15s;
    }

    .filters button.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    .list { list-style: none; }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      animation: slideIn .15s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item span {
      flex: 1;
      font-size: .97rem;
      color: #1e293b;
      word-break: break-word;
    }

    .item.done span {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .item .del {
      background: none;
      border: none;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 1.1rem;
      padding: 4px;
      border-radius: 6px;
      transition: color .15s;
      flex-shrink: 0;
    }

    .item .del:hover { color: #ef4444; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: .82rem;
      color: #94a3b8;
    }

    .footer button {
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: .82rem;
      transition: color .15s;
    }

    .footer button:hover { color: #ef4444; }

    .empty {
      text-align: center;
      color: #cbd5e1;
      padding: 40px 0;
      font-size: .95rem;
    }

    .error-bar {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .85rem;
      margin-bottom: 16px;
      display: none;
    }

    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 40px 0;
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Yapılacaklar</h1>
    <div class="error-bar" id="errorBar"></div>
    <div class="input-row">
      <input id="newTask" type="text" placeholder="Yeni görev ekle..." maxlength="200">
      <button id="addBtn" title="Ekle">+</button>
    </div>
    <div class="filters">
      <button class="active" data-filter="all">Tümü</button>
      <button data-filter="active">Bekleyen</button>
      <button data-filter="done">Tamamlanan</button>
    </div>
    <ul class="list" id="list"><li class="loading">Yükleniyor…</li></ul>
    <div class="footer">
      <span id="count"></span>
      <button id="clearDone">Tamamlananları sil</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tgtvpveurdxebkeihkiv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRndHZwdmV1cmR4ZWJrZWloa2l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzY3MTMsImV4cCI6MjA5Mzc1MjcxM30.TzK384wPZXbJXNbH7DpdQ9l0Wl6pheuq8LViYD579vk';
    const BASE = `${SUPABASE_URL}/rest/v1/todos`;
    const HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
    };

    let tasks = [];
    let filter = 'all';

    const listEl  = document.getElementById('list');
    const input   = document.getElementById('newTask');
    const countEl = document.getElementById('count');
    const addBtn  = document.getElementById('addBtn');
    const errBar  = document.getElementById('errorBar');

    function showError(msg) {
      errBar.textContent = msg;
      errBar.style.display = 'block';
      setTimeout(() => { errBar.style.display = 'none'; }, 4000);
    }

    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { ...HEADERS, ...(method !== 'GET' ? { 'Prefer': 'return=representation' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `HTTP ${res.status}`);
      }
      const text = await res.text();
      return text ? JSON.parse(text) : [];
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function render() {
      const visible = tasks.filter(t =>
        filter === 'all'    ? true :
        filter === 'active' ? !t.done :
                               t.done
      );

      listEl.innerHTML = '';

      if (!visible.length) {
        listEl.innerHTML = '<li class="empty">Görev yok</li>';
      } else {
        visible.forEach(t => {
          const li = document.createElement('li');
          li.className = 'item' + (t.done ? ' done' : '');
          li.innerHTML = `
            <input type="checkbox" ${t.done ? 'checked' : ''} data-id="${t.id}">
            <span>${escHtml(t.text)}</span>
            <button class="del" data-id="${t.id}" title="Sil">&#10005;</button>
          `;
          listEl.appendChild(li);
        });
      }

      const remaining = tasks.filter(t => !t.done).length;
      countEl.textContent = `${remaining} görev kaldı`;
    }

    async function loadTasks() {
      try {
        tasks = await api('GET', `${BASE}?order=created_at.desc`);
        render();
      } catch (e) {
        listEl.innerHTML = '';
        showError('Görevler yüklenemedi: ' + e.message);
      }
    }

    async function addTask() {
      const text = input.value.trim();
      if (!text) return;
      addBtn.disabled = true;
      try {
        const [created] = await api('POST', BASE, { text, done: false });
        tasks.unshift(created);
        input.value = '';
        render();
      } catch (e) {
        showError('Görev eklenemedi: ' + e.message);
      } finally {
        addBtn.disabled = false;
      }
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    listEl.addEventListener('change', async e => {
      if (e.target.type !== 'checkbox') return;
      const id = +e.target.dataset.id;
      const done = e.target.checked;
      try {
        await api('PATCH', `${BASE}?id=eq.${id}`, { done });
        const t = tasks.find(t => t.id === id);
        if (t) { t.done = done; render(); }
      } catch (e) {
        showError('Güncellenemedi: ' + e.message);
        await loadTasks();
      }
    });

    listEl.addEventListener('click', async e => {
      const btn = e.target.closest('.del');
      if (!btn) return;
      const id = +btn.dataset.id;
      try {
        await api('DELETE', `${BASE}?id=eq.${id}`);
        tasks = tasks.filter(t => t.id !== id);
        render();
      } catch (e) {
        showError('Silinemedi: ' + e.message);
      }
    });

    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });

    document.getElementById('clearDone').addEventListener('click', async () => {
      try {
        await api('DELETE', `${BASE}?done=eq.true`);
        tasks = tasks.filter(t => !t.done);
        render();
      } catch (e) {
        showError('Silinemedi: ' + e.message);
      }
    });

    loadTasks();
  </script>
</body>
</html>
